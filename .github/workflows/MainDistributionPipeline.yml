#
# Builds, tests and (optionally) releases the extension with DuckDB's extension distribution pipeline
#
# A full build compiles OpenUSD and DuckDB from source on every platform (hours of runner time, macOS minutes
# being the most expensive), so:
#   - pull requests build and test linux_amd64 only (reduced CI mode), and a new push cancels the previous run;
#   - pushes to main and manual runs build every platform; macOS only starts once Linux has passed. Build caches
#     saved on main are shared with every pull request;
#   - changes that only touch documentation do not run CI;
#   - the format check runs first (a few minutes, no build), and the build only starts once it has passed.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', 'THIRD_PARTY_NOTICES.txt']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  code-quality-check:
    name: Code quality
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: usd
      # clang-tidy needs a full build with OpenUSD - formatting only
      format_checks: 'format'

  duckdb-stable-build:
    name: Build extension binaries
    needs: code-quality-check
    # DuckDB 2.0.0, with the extension CI tools of its release branch
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: v2.0.0
      ci_tools_version: v2.0-cyanoptera
      extension_name: usd
      # Linux and macOS only: Windows is not a target, and OpenUSD does not build for WebAssembly or musl
      exclude_archs: 'windows_amd64;windows_arm64;windows_amd64_mingw;windows_amd64_rtools;wasm_mvp;wasm_eh;wasm_threads;linux_amd64_musl;linux_arm64_musl'
      reduced_ci_mode: ${{ github.event_name == 'pull_request' && 'enabled' || 'auto' }}
